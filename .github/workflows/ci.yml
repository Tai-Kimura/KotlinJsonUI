name: ci

# Per-push verification for the published modules. Keeps the zero-deprecation
# state reached in the 2.9.3 migration from regressing, and runs the JVM unit
# suites. The Compose-dynamic conformance suite (emulator) lives in the
# jsonui-cli repo's conformance-mobile workflow, not here.
#
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # Vendored attr tables ↔ jsonui-cli manifest. The dynamic/generated
  # tree is hand-rsynced from jsonui-cli's attr-codegen emit; this job is
  # the gate that the rsync discipline used to be. It fetches
  # build/attr_codegen/manifest.json at the pinned jsonui-cli ref and
  # compares sha256 bidirectionally (mismatch, missing, or stray file all
  # fail). PIN BUMP: the commit that re-vendors the tables updates
  # JSONUI_CLI_MANIFEST_REF in the SAME commit — prefer a release tag
  # once the next jsonui-cli release lands (manifest exists from 2299153
  # onward; tags v1.2.1 and earlier predate it).
  # ------------------------------------------------------------------ #
  vendored-attr-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JSONUI_CLI_MANIFEST_REF: 37bcd6a
    steps:
      - uses: actions/checkout@v4
      - name: Verify sha256 against pinned manifest
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, sys, urllib.request

          ref = os.environ["JSONUI_CLI_MANIFEST_REF"]
          url = (
              "https://raw.githubusercontent.com/Tai-Kimura/jsonui-cli/"
              f"{ref}/build/attr_codegen/manifest.json"
          )
          manifest = json.load(urllib.request.urlopen(url))
          vendored = "library-dynamic/src/main/kotlin/com/kotlinjsonui/dynamic/generated"
          # skipped_attributes.json is emit metadata and is deliberately
          # not vendored into the library repos.
          expected = {
              name.split("/", 1)[1]: sha
              for name, sha in manifest["files"].items()
              if name.startswith("kotlin/")
              and not name.endswith("skipped_attributes.json")
          }
          actual = {
              entry: hashlib.sha256(
                  open(os.path.join(vendored, entry), "rb").read()
              ).hexdigest()
              for entry in sorted(os.listdir(vendored))
              if os.path.isfile(os.path.join(vendored, entry))
          }
          problems = [
              f"missing from vendored dir: {n}" for n in expected if n not in actual
          ] + [
              f"hash mismatch (re-vendor + bump the pin together): {n}"
              for n in expected
              if n in actual and actual[n] != expected[n]
          ] + [
              f"not in manifest (stray or renamed): {n}" for n in actual if n not in expected
          ]
          if problems:
              print(f"vendored attr tables diverge from jsonui-cli manifest @ {ref}:")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)
          print(f"vendored attr tables match manifest @ {ref[:12]} ({len(expected)} files)")
          EOF

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile (release, all warnings)
        run: |
          ./gradlew :library:compileReleaseKotlin :library-dynamic:compileReleaseKotlin \
            :sample-app:compileDevDebugKotlin \
            --warning-mode all --rerun-tasks 2>&1 | tee compile.log
      - name: Warning gate (zero tolerated)
        # 2.9.3 removed every deprecation warning and the follow-up brush-up
        # removed the remaining named-parameter / unchecked-cast warnings.
        # Fail if ANY Kotlin compiler warning comes back.
        run: |
          if grep -E "^w: " compile.log; then
            echo "::error::compiler warnings reintroduced (see above)"
            exit 1
          fi
          echo "warning gate: OK"
      - name: Unit tests
        run: ./gradlew :library:testReleaseUnitTest :library-dynamic:testReleaseUnitTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            library/build/reports/tests/
            library-dynamic/build/reports/tests/
